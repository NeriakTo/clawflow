# CI — 持續整合：型別檢查、測試、建置
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 型別檢查 ──────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript 型別檢查
        run: npx tsc --noEmit

  # ── 測試 ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      PNPM_ALLOW_BUILDS: better-sqlite3,esbuild
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴（含 native builds）
        run: pnpm install --frozen-lockfile
        env:
          npm_config_ignore_scripts: false

      - name: 確保 better-sqlite3 native bindings
        run: |
          SQLITE_DIR=$(find node_modules -path "*/better-sqlite3/build/Release/better_sqlite3.node" 2>/dev/null | head -1)
          if [ -z "$SQLITE_DIR" ]; then
            echo "Native bindings not found, rebuilding..."
            npx --yes node-gyp rebuild --directory=$(find node_modules/.pnpm -path "*/better-sqlite3/binding.gyp" -exec dirname {} \; | head -1)
          else
            echo "Native bindings found: $SQLITE_DIR"
          fi

      - name: 執行測試（含覆蓋率）
        run: pnpm test -- --coverage

      - name: 上傳覆蓋率報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── 建置 ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 建置專案
        run: pnpm build

      - name: 驗證 dist/ 產出
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::dist/ 目錄不存在或為空"
            exit 1
          fi
          echo "dist/ 產出驗證通過："
          ls -la dist/
